
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: filmfiesta-backend
    restart: unless-stopped

    env_file:
      - ./backend/.env

    environment:
      NODE_ENV: production
      PORT: 5000
      FRONTEND_URL: http://localhost:8080

    ports:
      - "5000:5000"

    networks:
      - filmfiesta-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    container_name: filmfiesta-frontend
    restart: unless-stopped

    ports:
      - "8080:80"

    depends_on:
      - backend

    networks:
      - filmfiesta-network

networks:
  filmfiesta-network:
    driver: bridge