
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: filmfiesta-backend
    env_file:
      - ./backend/.env
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000
    container_name: filmfiesta-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped